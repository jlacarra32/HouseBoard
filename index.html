<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="HouseBoard — App familiar para organizar la lista de la compra y las tareas del hogar en tiempo real." />
  <title>HouseBoard</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Lucide Icons (CDN) -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Vercel Analytics (vanilla HTML — no npm needed) -->
  <script defer src="/_vercel/insights/script.js"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="./css/reset.css" />
  <link rel="stylesheet" href="./css/styles.css" />
  <link rel="stylesheet" href="./css/shopping.css" />
  <link rel="stylesheet" href="./css/tasks.css" />

  <!-- Favicon e iconos PWA -->
  <link rel="icon" type="image/png" href="/assets/icon.png" />
  <link rel="apple-touch-icon" href="/assets/icon.png" />
  <link rel="manifest" href="/manifest.json" />
</head>
<body>

  <!-- ──────────────────────────────────────────────────────────────────────────
       PANTALLA DE BIENVENIDA
       Se muestra si no hay nombre de usuario guardado en localStorage.
  ─────────────────────────────────────────────────────────────────────────── -->
  <div id="welcome-screen" hidden>
    <h1 class="welcome__logo">HouseBoard</h1>
    <p class="welcome__subtitle">Tu hogar, organizado.</p>

    <!-- Paso 1: Pedir nombre -->
    <div class="welcome__card" id="welcome-step-1">
      <div>
        <label for="welcome-input">¿Cómo te llaman en casa?</label>
        <input
          type="text"
          id="welcome-input"
          class="form-input"
          placeholder="Tu nombre…"
          maxlength="30"
          autocomplete="given-name"
        />
      </div>
      <button id="welcome-btn-next" class="btn btn--primary btn--full btn--pill">
        Siguiente
      </button>
    </div>

    <!-- Paso 2: Crear o Unirse a Casa -->
    <div class="welcome__card" id="welcome-step-2" hidden>
      <div id="welcome-home-options">
        <button id="welcome-btn-create-view" class="btn btn--primary btn--full btn--pill" style="margin-bottom: 10px;">
          Crear casa
        </button>
        <button id="welcome-btn-join-view" class="btn btn--secondary btn--full btn--pill">
          Unirse a casa
        </button>
      </div>

      <div id="welcome-create-form" hidden>
        <label for="welcome-home-name">Nombre de la nueva casa</label>
        <input
          type="text"
          id="welcome-home-name"
          class="form-input"
          placeholder="Ej: Villa HouseBoard"
          maxlength="40"
        />
        <button id="welcome-btn-create" class="btn btn--primary btn--full btn--pill" style="margin-top:10px;">
          Crear y entrar
        </button>
        <button class="welcome-btn-back btn btn--secondary btn--full btn--pill" style="margin-top:10px;">Volver</button>
      </div>

      <div id="welcome-join-form" hidden>
        <label for="welcome-home-code">Código de la casa (6 caracteres)</label>
        <input
          type="text"
          id="welcome-home-code"
          class="form-input"
          placeholder="Ej: X7A9P2"
          maxlength="6"
          style="text-transform: uppercase;"
        />
        <button id="welcome-btn-join" class="btn btn--primary btn--full btn--pill" style="margin-top:10px;">
          Unirse y entrar
        </button>
        <button class="welcome-btn-back btn btn--secondary btn--full btn--pill" style="margin-top:10px;">Volver</button>
      </div>
    </div>
  </div>

  <!-- ──────────────────────────────────────────────────────────────────────────
       APLICACIÓN PRINCIPAL
       Oculta hasta que hay un nombre de usuario.
  ─────────────────────────────────────────────────────────────────────────── -->
  <div id="app" hidden>

    <!-- Header fijo -->
    <header class="app-header" role="banner">
      <div class="app-header__logo" aria-label="HouseBoard">
        <img src="/assets/icon.png" alt="" class="app-header__logo-img" aria-hidden="true" />
        HouseBoard
        <span id="header-home-name" class="header-home-name"></span>
      </div>
      <div class="app-header__right">
        <div class="app-header__user" aria-label="Usuario activo">
          <i data-lucide="user" aria-hidden="true"></i>
          <span id="header-username"></span>
        </div>
        <button
          class="app-header__settings"
          id="settings-btn"
          aria-label="Abrir ajustes"
          title="Ajustes"
        >
          <i data-lucide="settings" aria-hidden="true"></i>
        </button>
      </div>
    </header>

    <!-- Navegación horizontal (desktop) -->
    <nav class="app-nav" role="navigation" aria-label="Módulos de la app">
      <button
        class="app-nav__tab tab--active"
        data-module="shopping-module"
        role="tab"
        aria-selected="true"
        aria-controls="shopping-module"
        id="tab-shopping"
      >
        <i data-lucide="shopping-cart" aria-hidden="true"></i>
        Compra
      </button>
      <button
        class="app-nav__tab"
        data-module="tasks-module"
        role="tab"
        aria-selected="false"
        aria-controls="tasks-module"
        id="tab-tasks"
      >
        <i data-lucide="check-square" aria-hidden="true"></i>
        Tareas
      </button>
    </nav>

    <!-- Bottom nav (móvil) -->
    <nav class="bottom-nav" role="navigation" aria-label="Navegación principal">
      <div class="bottom-nav__inner">
        <button
          class="bottom-nav__tab tab--active"
          data-module="shopping-module"
          role="tab"
          aria-selected="true"
          aria-controls="shopping-module"
          id="bottom-tab-shopping"
        >
          <i data-lucide="shopping-cart" aria-hidden="true"></i>
          Compra
        </button>
        <button
          class="bottom-nav__tab"
          data-module="tasks-module"
          role="tab"
          aria-selected="false"
          aria-controls="tasks-module"
          id="bottom-tab-tasks"
        >
          <i data-lucide="check-square" aria-hidden="true"></i>
          Tareas
        </button>
      </div>
    </nav>

    <!-- Zona de contenido -->
    <main class="app-content" role="main" id="content">
      <!-- Módulo: Lista de la Compra -->
      <section
        id="shopping-module"
        class="module-section"
        role="tabpanel"
        aria-labelledby="tab-shopping"
      ></section>

      <!-- Módulo: Tareas del Hogar -->
      <section
        id="tasks-module"
        class="module-section"
        role="tabpanel"
        aria-labelledby="tab-tasks"
        hidden
      ></section>
    </main>

  </div><!-- /#app -->

  <!-- Settings panel and overlay are injected by ui-settings.js -->

  <!-- Toast container (fuera del flujo) -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Scripts ES Modules (orden de dependencias) -->
  <script type="module" src="./js/firebase-config.js"></script>
  <script type="module" src="./js/db-homes.js"></script>
  <script type="module" src="./js/db-shopping.js"></script>
  <script type="module" src="./js/db-tasks.js"></script>
  <script type="module" src="./js/ui-shared.js"></script>
  <script type="module" src="./js/ui-settings.js"></script>
  <script type="module" src="./js/ui-shopping.js"></script>
  <script type="module" src="./js/ui-tasks.js"></script>
  <script type="module" src="./js/app.js"></script>

</body>
</html>
